<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glowing Flower Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle, #1a0b1e 0%, #05020a 100%);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ওপরের মেসেজ ও বাটন কন্টেইনার */
    .top-container {
      position: absolute;
      top: 30px;
      z-index: 10;
      text-align: center;
      width: 90%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 30px rgba(178, 0, 255, 0.2);
    }
    .greeting-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
      line-height: 1.5;
      text-shadow: 0 0 10px #ff2a74, 0 0 20px #b200ff;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }
    .btn {
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s ease;
      color: white;
    }
    .btn-yes {
      background: linear-gradient(45deg, #ff2a74, #b200ff);
      box-shadow: 0 0 15px rgba(255, 42, 116, 0.6);
    }
    .btn-no {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    .btn:active {
      transform: scale(0.95);
    }

    /* নিচের ব্যান্ড নেম */
    .text-container {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    .brand-text {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px #ff2a74,
        0 0 20px #ff2a74,
        0 0 40px #ff2a74,
        0 0 80px #b200ff;
      animation: glowPulse 2.5s infinite alternate ease-in-out;
    }
    .sub-text {
      font-size: 12px;
      color: #e0b0ff;
      letter-spacing: 3px;
      margin-top: 5px;
      opacity: 0.8;
    }

    @keyframes glowPulse {
      0% {
        filter: drop-shadow(0 0 5px rgba(255, 42, 116, 0.8)) blur(0px);
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(178, 0, 255, 0.9)) blur(1px);
        transform: scale(1.03);
      }
      100% {
        filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.8)) blur(0.5px);
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- ওপরের টেক্সট ও বাটন -->
  <div class="top-container">
    <div class="greeting-text">আসসালামু আলাইকুম<br>আপনাকে আমার ভালো লাগে 🥹</div>
    <div class="btn-group">
      <a href="https://wa.me/8801887166252?text=জামাই%20জান%20কি%20করেন" class="btn btn-yes" style="text-decoration: none; display: inline-block;">হ্যাঁ</a>
      <button class="btn btn-no" onclick="alert('ধন্যবাদ জানানোর জন্য! 😊')">না</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- নিচের নাম -->
  <div class="text-container">
    <div class="brand-text">GQ ATIKUL</div>
    <div class="sub-text">CLICK ANYWHERE TO PLANT A FLOWER</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flowers = [];
    const particles = [];

    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        alpha: Math.random(),
        speed: Math.random() * 0.5 + 0.1
      });
    }

    class Flower {
      constructor(x, y) {
        this.x = x;
        this.targetY = y;
        this.currentY = height;
        this.stemHeight = height - y;
        this.progress = 0;
        this.petals = Math.floor(Math.random() * 4) + 5;
        this.color = ['#ff2a74', '#ff7300', '#00e5ff', '#b200ff', '#ffffff'][Math.floor(Math.random() * 5)];
        this.flowerSize = Math.random() * 15 + 20;
        this.done = false;
      }

      update() {
        if (this.progress < 1) {
          this.progress += 0.02;
          this.currentY = height - (this.stemHeight * this.progress);
        } else {
          this.done = true;
        }
      }

      draw() {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        ctx.beginPath();
        ctx.moveTo(this.x, height);
        ctx.quadraticCurveTo(this.x + Math.sin(this.progress * 3) * 20, (height + this.currentY) / 2, this.x, this.currentY);
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 4;
        ctx.stroke();

        if (this.progress > 0.4) {
          ctx.beginPath();
          ctx.ellipse(this.x - 10, height - (this.stemHeight * 0.4), 12, 5, -Math.PI / 4, 0, Math.PI * 2);
          ctx.fillStyle = '#2e7d32';
          ctx.fill();
        }
        if (this.progress > 0.7) {
          ctx.beginPath();
          ctx.ellipse(this.x + 10, height - (this.stemHeight * 0.7), 12, 5, Math.PI / 4, 0, Math.PI * 2);
          ctx.fillStyle = '#2e7d32';
          ctx.fill();
        }

        if (this.progress > 0.8) {
          const bloomScale = (this.progress - 0.8) * 5;
          ctx.translate(this.x, this.currentY);
          
          for (let i = 0; i < this.petals; i++) {
            const angle = (i * Math.PI * 2) / this.petals;
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.ellipse(0, (this.flowerSize * bloomScale) / 2, (this.flowerSize * bloomScale) / 3, this.flowerSize * bloomScale, 0, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.rotate(-angle);
          }

          ctx.beginPath();
          ctx.arc(0, 0, (this.flowerSize / 3) * bloomScale, 0, Math.PI * 2);
          ctx.fillStyle = '#ffeb3b';
          ctx.shadowColor = '#ffeb3b';
          ctx.shadowBlur = 20;
          ctx.fill();
        }

        ctx.restore();
      }
    }

    window.addEventListener('click', (e) => {
      // যদি ক্লিক বাটনে না হয় তবেই ফুল জন্মাবে
      if (!e.target.closest('.top-container')) {
        flowers.push(new Flower(e.clientX, e.clientY));
      }
    });

    setTimeout(() => flowers.push(new Flower(width * 0.35, height * 0.55)), 300);
    setTimeout(() => flowers.push(new Flower(width * 0.65, height * 0.50)), 600);

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
      });

      flowers.forEach(flower => {
        flower.update();
        flower.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
